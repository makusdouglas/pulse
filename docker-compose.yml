services:
  db:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_DB: churndb
      POSTGRES_USER: churn
      POSTGRES_PASSWORD: churn123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U churn -d churndb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api_v2:
    build:
      context: ./backend_v2
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.shared
      - .env.backend
    environment:
      DATABASE_URL: postgresql://churn:churn123@db:5432/churndb
      APP_PORT: "8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./.env.frontend
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - api_v2

volumes:
  pgdata:
